# 🤖 Bot Polymarket — 24/7 GitHub Actions + runner propio (servicio Windows)
# shell: cmd + PYTHON POR RUTA ABSOLUTA (el servicio no tiene el PATH del usuario)

name: Bot Polymarket Elon (real)

on:
  schedule:
    - cron: '0-59/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Espera escalonada (no saturar fuentes)
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 0"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ejecutar una pasada del bot (MODO REAL)
        shell: cmd
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_WALLET_ADDRESS: ${{ secrets.POLY_WALLET_ADDRESS }}
          REAL_CONFIRMADO: ${{ secrets.REAL_CONFIRMADO }}
        run: |
          set "PYEXE=C:\Users\lameg\AppData\Local\Python\pythoncore-3.14-64\python.exe"
          if exist "%PYEXE%" goto pyok
          set "PYEXE=python"
          where python >nul 2>&1 && goto pyok
          set "PYEXE=py -3"
          :pyok
          echo [PY] %PYEXE%
          "%PYEXE%" -m pip install --quiet --upgrade pip
          "%PYEXE%" -m pip install --quiet openpyxl py-clob-client-v2
          "%PYEXE%" -u bot.py --modo real --excel

      - name: Guardar estado (commit de los datos)
        shell: cmd
        run: |
          git config user.name "bot-poly"
          git config user.email "bot-poly@users.noreply.github.com"
          git add -A
          git pull --rebase --autostash "https://x-access-token:%GITHUB_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" HEAD:main >nul 2>&1
          git diff --cached --quiet
          if errorlevel 1 git commit -m "estado bot %DATE% %TIME%"
          git push "https://x-access-token:%GITHUB_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" HEAD:main
