name: Bot Polymarket Elon (real)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comprobar Python (usar el del PC)
        run: python --version

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openpyxl py-clob-client-v2

      - name: Ejecutar una pasada del bot (MODO REAL)
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_WALLET_ADDRESS: ${{ secrets.POLY_WALLET_ADDRESS }}
          REAL_CONFIRMADO: ${{ secrets.REAL_CONFIRMADO }}
        run: python -u bot.py --modo real --excel

      - name: Guardar estado (commit de los datos)
        run: |
          git config user.name "bot-poly"
          git config user.email "bot-poly@users.noreply.github.com"
          git add -A
          git pull --rebase --autostash "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:main 2>$null
          Write-Host "pull exit: $LASTEXITCODE (si falla no es critico)"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "estado bot $(Get-Date -Format 'yyyy-MM-dd HH:mm')" }
          git push "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:main
