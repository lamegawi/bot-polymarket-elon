name: Bot Polymarket Elon (real)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openpyxl py-clob-client-v2

      - name: Ejecutar una pasada del bot (MODO REAL)
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_WALLET_ADDRESS: ${{ secrets.POLY_WALLET_ADDRESS }}
          POLY_API_KEY: ${{ secrets.POLY_API_KEY }}
          POLY_API_SECRET: ${{ secrets.POLY_API_SECRET }}
          POLY_API_PASSPHRASE: ${{ secrets.POLY_API_PASSPHRASE }}
          POLY_RELAYER_API_KEY: ${{ secrets.POLY_RELAYER_API_KEY }}
          POLY_RELAYER_API_KEY_ADDRESS: ${{ secrets.POLY_RELAYER_API_KEY_ADDRESS }}
          REAL_CONFIRMADO: ${{ secrets.REAL_CONFIRMADO }}
        run: python -u bot.py --modo real --excel

      - name: Guardar estado (commit de los datos)
        run: |
          git config user.name "bot-poly"
          git config user.email "bot-poly@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "estado bot $(date -u +'%Y-%m-%d %H:%M')"
          git push "https://x-access-token:${PAT_BOT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          PAT_BOT: ${{ secrets.PAT_BOT }}
